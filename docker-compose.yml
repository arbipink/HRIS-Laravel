services:
  db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: hrms_db
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  php:
    build:
      context: .
      dockerfile: PHP.Dockerfile
    container_name: php-container
    restart: always
    # Matches host UID/GID so composer files aren't locked to root
    user: "${UID:-1000}:${GID:-1000}" 
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    restart: always
    ports: # Comment this line if you want to run it on server
      - '80:80' # Comment this line if you want to run it on server
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend_net

  proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm-container
    restart: always
    #ports: # Uncomment this line to run it on server
    #  - '80:80' # Uncomment this line to run it on server
    #  - '443:443' # Uncomment this line to run it on server 
    #  - '81:81' # Uncomment this line to run it on server
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    networks:
      - backend_net

  adminer:
    image: adminer:latest
    container_name: adminer-container
    restart: always
    ports:
      - '8080:8080' # Exposed so you can manage your DB via http://localhost:8080
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  db_data: